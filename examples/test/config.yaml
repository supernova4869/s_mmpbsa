# s_mmpbsa configuration file.  Run it with:  s_mmpbsa -c config.yaml
# Empty strings mean "not set"; comments describe every field.
program_set:
  sys_name: system                      # system name used by the output files
  calc_mm: true                         # calculate the molecular mechanics term
  calc_pbsa: false                       # calculate the PB/SA term
  debug: false                          # keep intermediate PB/SA files
  trj: md.xtc                           # trajectory file (xtc/trr/gro/pdb)
  tpr: md.tpr                           # run input file
  ndx: index.ndx                        # index file (generated when missing)
  ala_scan_range: ''                    # alanine-scanning residues, e.g. "12,30-35"; empty = none
mm_set:
  cutoff: .inf                          # MM distance cutoff (A); .inf = no cutoff
  electric_screening: true              # electrostatic screening (J. Chem. Inf. Model. 2021, 61, 2454)
  interaction_entropy: true             # interaction entropy (-TDS); turning it off speeds the run up a lot
  rec_grp: Receptor                      # receptor group name of the index file
  lig_grp: Ligand                           # ligand group name; empty = solvation-only calculation
  start_time: 90.0                       # first time to analyze (ns)
  end_time: .inf                        # last time to analyze (ns); .inf = until the end
  dt: 1.0                               # time interval between analyzed frames (ns)
  ie_multiple: 10                       # interaction-entropy sampling rate multiple
  fix_pbc: true                         # fix periodic boundary conditions first
  radius_type: mBondi                   # atom radius set: ff | amber | Bondi | mBondi | mBondi2
pbe_set:
  temp: 298.15                          # temperature (K)
  pdie: 2                               # solute dielectric constant
  sdie: 78.4                            # solvent dielectric constant (water: 78.4 at 298.15 K, vacuum: 1)
  pb_solver: lpbe                       # PB equation: lpbe (linear, recommended) | npbe (nonlinear)
  bcfl: mdh                             # boundary condition: zero | sdh | mdh (recommended) | focus | mem | map
  srfm: smol                            # surface definition: mol | smol (recommended) | spline | spline3 | spline4 | sacc
  chgm: spl4                            # charge mapping: tril | spl2 | spl4 (recommended)
  swin: 0.3                             # spline window (A), only for spline/spline3/spline4 surfaces
  srad: 1.4                             # solvent probe radius (A)
  sdens: 10                             # surface density (grid points/A^2), for mol/sacc surfaces
  calc_energy: comps                    # energy output: no | total | comps (comps is what s_mmpbsa needs)
  ions:                                 # mobile ions (charge in e, conc in M, radius in A), one block per species
  - charge: 1
    conc: 0.15
    radius: 0.95
  - charge: -1
    conc: 0.15
    radius: 1.81
  cfac: 1.5                             # coarse grid expansion factor (with -c config; interactive: menu 6)
  fadd: 5                               # fine grid padding (A) (with -c config; interactive: menu 7)
  df: 0.5                               # fine mesh spacing (A) (with -c config; interactive: menu 8)
pba_set:
  temp: 298.15                          # temperature (K)
  srfm: sacc                            # model for the solvent surface/volume (sacc recommended)
  swin: 0.3                             # cubic spline window (A)
  srad: 1.4                             # probe radius (A)
  gamma: 0.0226778                      # surface tension (kJ/mol/A^2)
  press: 0.0                            # pressure for the SAV term (kJ/mol/A^3)
  bconc: 3.84982                        # solvent bulk density (A^-3)
  sdens: 10.0                           # surface point density
  dpos: 0.2                             # spacing of the volume-integration grid (A)
  grid: [0.1, 0.1, 0.1]                 # explicit apolar integration grid spacing (A); keep [0.1, 0.1, 0.1]
  calc_force: false                     # compute apolar forces
  calc_energy: comps                    # apolar energy output: no | total | comps
