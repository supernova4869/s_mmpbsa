[package]
name = "s_mmpbsa"
version = "1.1.0"
edition = "2021"
authors = ["Jiaxing Zhang <zhangjiaxing7137@tju.edu.cn>"]
description = "s_mmpbsa - A lite, cross-platform MM-PBSA program"

[workspace]
members = ["apbs/apbs-generic", "apbs/apbs-mg", "apbs/apbs-pmgc", "gmx-rs-tools"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
regex = "^1.6.0"
toml = "1"
ndarray = { version = "^0.17.2", features = ["rayon", "serde"] }
indicatif = "0.18"
chrono = "0.4.19"
serde = { version = "1.0.152", features = ["derive"] }
serde_yaml = "0.9"
serde-pickle = "1.1.1"
rayon = "1.7.0"
colored = "3"
clap = { version = "4.0", features = ["derive", "env"] }
rand = "0.10.1"
apbs-generic = { path = "apbs/apbs-generic" }
apbs-mg = { path = "apbs/apbs-mg" }
gmx-rs-tools = { path = "gmx-rs-tools" }

[target.'cfg(not(target_env = "musl"))'.dependencies]
plotters = "0.3.5"
